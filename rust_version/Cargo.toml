[package]
name = "jsonsh"
version = "1.5.1"
edition = "2021"
description = "Process JSON/JSONC with JavaScript-like expressions (Rust port)"

[dependencies]
caseless = "0.2"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Time"] }

[lib]
name = "jsonsh"
path = "src/lib.rs"

[[bin]]
name = "jsonsh"
path = "src/main.rs"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
