[package]
name = "jsonsh"
version = "1.3.0"
edition = "2021"
description = "Process JSON/JSONC with JavaScript-like expressions (Rust port)"

[dependencies]
caseless = "0.2"
unicode-general-category = "1"

[lib]
name = "jsonsh"
path = "src/lib.rs"

[[bin]]
name = "jsonsh"
path = "src/main.rs"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
