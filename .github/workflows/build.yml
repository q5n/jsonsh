name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            goos: windows
            output: dist/jsonsh.exe
            artifact: jsonsh-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            goos: linux
            output: dist/jsonsh
            artifact: jsonsh-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Create output directory
        run: mkdir dist

      - name: Build ${{ matrix.name }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -trimpath -ldflags "-X main.version=${{ env.VERSION }}" -o "${{ matrix.output }}" ./cmd/jsonsh

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
