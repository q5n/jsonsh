name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            output: target/release/jsonsh.exe
            archive: jsonsh-windows-x64.zip
            artifact: jsonsh-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            output: target/release/jsonsh
            archive: jsonsh-linux-x64.zip
            artifact: jsonsh-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows x64
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -LiteralPath "${{ matrix.output }}" -DestinationPath "${{ matrix.archive }}"

      - name: Package Linux x64
        if: matrix.os == 'ubuntu-latest'
        run: zip "${{ matrix.archive }}" "${{ matrix.output }}"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: rust_version/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jsonsh-*-x64
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum jsonsh-* > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
